# Run `update-python-support --auto-update` on all packages from here, so the
# private key of the GitHub App is only stored in this repository.
name: auto-update

permissions:
  contents: read

on:
  schedule:
    - cron: '0 12 * * 0'  # run once a week on Sunday
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      repos:
        description: 'Space separated repository names (default: all packages)'
        required: false
        default: ''

jobs:
  list:
    runs-on: ubuntu-latest
    name: list packages
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
    # actions/checkout@v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: List packages
      id: list
      env:
        REPOS: ${{ inputs.repos }}
      run: |
        if [ -n "$REPOS" ]; then
          printf '%s\n' $REPOS
        else
          cat src/zope/meta/*/packages.txt | grep -v '^#'
        fi | grep . | jq -R . | jq -sc . > repos.json
        # GitHub allows at most 256 jobs per matrix:
        if [ "$(jq length repos.json)" -gt 256 ]; then
          echo "::error::Too many packages for a single matrix."
          exit 1
        fi
        echo "repos=$(cat repos.json)" >> "$GITHUB_OUTPUT"

  update:
    needs: list
    runs-on: ubuntu-latest
    # Restrict this environment to `master` in the repository settings, so
    # only reviewed code gets access to the private key of the GitHub App:
    environment: auto-update
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        repo: ${{ fromJSON(needs.list.outputs.repos) }}
    name: ${{ matrix.repo }}
    steps:
    # actions/checkout@v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: meta
        persist-credentials: false
    - name: Create GitHub App token
      # actions/create-github-app-token@v3.3.0
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      id: app-token
      with:
        client-id: ${{ vars.ZOPE_META_APP_CLIENT_ID }}
        private-key: ${{ secrets.ZOPE_META_APP_PRIVATE_KEY }}
        owner: zopefoundation
        repositories: ${{ matrix.repo }}
        permission-administration: write
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write
    # actions/checkout@v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: zopefoundation/${{ matrix.repo }}
        # config-package derives the package name from the directory name:
        path: ${{ matrix.repo }}
        # zest.releaser needs the tags to decide about the version bump:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}
    - name: Install uv
      # astral/setup-uv@10.3.0
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        enable-cache: false
        python-version: 3.13
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: update-python-support
      working-directory: ${{ matrix.repo }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        # Editable install from the checkout, so `commit-id` gets the commit of meta:
        uv run --project ../meta update-python-support . --auto-update --branch=update-python-support-$(date +'%Y-%m-%d')
