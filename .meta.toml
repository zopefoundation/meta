# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[meta]
template = "pure-python"
commit-id = "fa846ff4"

[python]
with-windows = false
with-pypy = false
with-future-python = true
with-docs = true
with-sphinx-doctests = false
with-macos = false
with-free-threaded-python = false

[pre-commit]
# The template fragments are included into other templates, their trailing
# blank line separates them from the next fragment.
whitespace-exclude = "^src/zope/meta/.*\\.j2$"

[coverage]
fail-under = 10

[coverage-run]
source = "zope.meta"

[manifest]
additional-rules = [
    "include *.yaml",
    "recursive-include docs *.bat",
    "recursive-include src *.j2",
    "recursive-include src *.md",
    "recursive-include src *.sh",
    "recursive-include src *.txt",
    ]

[check-manifest]
additional-ignores = [
    "docs/_build/html/_static/scripts/*",
    ]

[tox]
testenv-deps = [
    "readme-renderer < 45",
    ]
